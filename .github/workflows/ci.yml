name: CI

on:
  push:
    branches: [main, v3-dev, "v3/**", v3.1-dev]
  pull_request:
    branches: [main, v3-dev, v3.1-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        runs-on:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Test against the same hash-pinned versions the README tells users to
      # install. The lock targets Python 3.10+, so 3.9 (dropped in 3.0) keeps
      # the unpinned requirements until then.
      - name: Install dependencies (hash-pinned)
        if: matrix.python != '3.9'
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Install dependencies (Python 3.9, unpinned)
        if: matrix.python == '3.9'
        run: pip install -r requirements.txt -e .

      - name: Run tests
        run: pytest

      - name: Coverage floors (line and branch, overall and per module)
        run: python tools/ci/check_coverage.py coverage.json

  # Ubuntu 26.04 and Debian 12 have no hosted runner yet: test them in a
  # container with the distribution's own python3 (E13-S2, E9-S1).
  container:
    name: Container / ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "debian:12"]
    steps:
      - name: Install python3
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 python3-venv git >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies (hash-pinned) and run the tests
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --require-hashes -r requirements-dev.lock
          /tmp/venv/bin/pip install -q --no-deps --no-build-isolation -e .
          /tmp/venv/bin/pytest
          /tmp/venv/bin/python tools/ci/check_coverage.py coverage.json

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit the hash-pinned runtime dependencies
        run: pip-audit --require-hashes --disable-pip -r requirements.lock

      - name: Audit the hash-pinned test dependencies
        run: pip-audit --require-hashes --disable-pip -r requirements-dev.lock

      - name: Install the lock exactly as documented
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --require-hashes -r requirements.lock
          /tmp/lockcheck/bin/pip install --no-deps --no-build-isolation .
          /tmp/lockcheck/bin/ubuntils version
