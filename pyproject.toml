[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntils"
description = "Ubuntu incident response tool for forensic artifact collection, detection, and guided remediation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asmit Desai", email = "asmitdesai02@gmail.com" }]
requires-python = ">=3.9"
keywords = ["incident-response", "forensics", "ubuntu", "security", "dfir"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dynamic = ["version"]
dependencies = [
    "click>=8.1.0",
    "textual>=0.50.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/asmitdesai/ubuntils"
Repository = "https://github.com/asmitdesai/ubuntils"
Issues = "https://github.com/asmitdesai/ubuntils/issues"

[project.scripts]
ubuntils = "ubuntils.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ubuntils.__version__" }

[tool.setuptools.packages.find]
include = ["ubuntils*"]

[tool.setuptools.package-data]
ubuntils = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Branch coverage on; the combined (line + branch) floor is the measured value
# rounded down, raised every milestone, never lowered. Line and branch are also
# gated separately, overall and per module, by tools/ci/check_coverage.py.
addopts = "--cov=ubuntils --cov-branch --cov-fail-under=94 --cov-report=term-missing --cov-report=json"
markers = [
    "real_deprecation_notices: keep the CLI's real deprecation notices (conftest silences them by default)",
]
