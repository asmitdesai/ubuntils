[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntils"
description = "Ubuntu incident response tool for forensic artifact collection, detection, and guided remediation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asmit Desai", email = "asmitdesai02@gmail.com" }]
requires-python = ">=3.9"
keywords = ["incident-response", "forensics", "ubuntu", "security", "dfir"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dynamic = ["version"]
dependencies = [
    "click>=8.1.0",
    "textual>=0.50.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/asmitdesai/ubuntils"
Repository = "https://github.com/asmitdesai/ubuntils"
Issues = "https://github.com/asmitdesai/ubuntils/issues"

[project.scripts]
ubuntils = "ubuntils.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ubuntils.__version__" }

[tool.setuptools.packages.find]
include = ["ubuntils*"]

[tool.setuptools.package-data]
ubuntils = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Branch coverage on; the combined (line + branch) floor is the measured value
# rounded down, raised every milestone, never lowered. Line and branch are also
# gated separately, overall and per module, by tools/ci/check_coverage.py.
addopts = "--cov=ubuntils --cov-branch --cov-fail-under=94 --cov-report=term-missing --cov-report=json"
markers = [
    "real_deprecation_notices: keep the CLI's real deprecation notices (conftest silences them by default)",
]

# Mutation testing (E13-S10): scheduled CI job, not per PR. See
# .github/workflows/mutation.yml; the score is published, survivors in the
# rules behind the review's C1-C9 cases are killed with new tests.
[tool.mutmut]
paths_to_mutate = ["ubuntils/analysis/cmdmatch.py", "ubuntils/detectors/rules.py"]
# The tests that exercise rules and the matcher (the whole suite includes
# install-location tests that can't run from mutmut's copy).
tests_dir = ["tests/test_cmdmatch.py", "tests/test_detection_rules.py", "tests/test_review_2_3.py",
             "tests/test_process_location.py", "tests/test_shell_rc_hijack.py",
             "tests/test_cron_breadth.py", "tests/test_parser_properties.py",
             "tests/test_golden_outputs.py", "tests/test_audit_2026_10_26.py",
             "tests/test_security_review_2026_11.py",
             "tests/fixture_hosts.py", "tests/__init__.py", "tests/conftest.py"]
also_copy = ["ubuntils/", "tools/", "examples/", "docs/", "README.md", "CHANGELOG.md", ".github/", "requirements.lock", "requirements-dev.lock", "tests/golden/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-o", "addopts=", "-x", "-q"]
